<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="800" height="300" fill="url(#bgGrad)"/>
  
  <!-- Large Professional Truck Silhouette -->
  <g transform="translate(450, 120)" opacity="0.25" fill="url(#truckGrad)">
    <!-- Cargo Box -->
    <rect x="0" y="0" width="200" height="90" rx="8" stroke="#1e40af" stroke-width="3"/>
    <line x1="10" y1="20" x2="190" y2="20" stroke="#60a5fa" stroke-width="2"/>
    <line x1="10" y1="40" x2="190" y2="40" stroke="#60a5fa" stroke-width="2"/>
    <line x1="10" y1="60" x2="190" y2="60" stroke="#60a5fa" stroke-width="2"/>
    
    <!-- Cabin -->
    <path d="M -50 10 L 0 10 L 0 90 L -60 90 L -60 50 Z" fill="url(#truckGrad)" stroke="#1e40af" stroke-width="3"/>
    <rect x="-45" y="20" width="35" height="30" rx="3" fill="#60a5fa" opacity="0.6"/>
    
    <!-- Front Grill -->
    <rect x="-65" y="55" width="8" height="30" rx="2" fill="#1e40af"/>
    <circle cx="-61" cy="65" r="4" fill="#fbbf24"/>
    
    <!-- Wheels (larger, more detailed) -->
    <g>
      <circle cx="-30" cy="95" r="20" fill="#1f2937" stroke="#000" stroke-width="2"/>
      <circle cx="-30" cy="95" r="12" fill="#4b5563"/>
      <circle cx="-30" cy="95" r="6" fill="#6b7280"/>
      
      <circle cx="40" cy="95" r="20" fill="#1f2937" stroke="#000" stroke-width="2"/>
      <circle cx="40" cy="95" r="12" fill="#4b5563"/>
      <circle cx="40" cy="95" r="6" fill="#6b7280"/>
      
      <circle cx="160" cy="95" r="20" fill="#1f2937" stroke="#000" stroke-width="2"/>
      <circle cx="160" cy="95" r="12" fill="#4b5563"/>
      <circle cx="160" cy="95" r="6" fill="#6b7280"/>
    </g>
  </g>
  
  <!-- Company Name - Bold and Professional -->
  <text x="400" y="100" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" fill="#1e40af" text-anchor="middle" letter-spacing="2" filter="url(#shadow)">
    PEX STEEL &amp; FABRICATION
  </text>
  <text x="400" y="155" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#1e40af" text-anchor="middle" letter-spacing="3" filter="url(#shadow)">
    LIMITED
  </text>
  
  <!-- Decorative Line -->
  <line x1="150" y1="175" x2="650" y2="175" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  
  <!-- Tagline -->
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#4b5563" text-anchor="middle" letter-spacing="1">
    Dealers in: motor fabrication, metal sheets adjustments,
  </text>
  <text x="400" y="222" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#4b5563" text-anchor="middle" letter-spacing="1">
    motor repairs and maintenance
  </text>
  
  <!-- Contact Info -->
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280" text-anchor="middle">
    P.O Box Nairobi | Email: pexsteellimited@gmail.com | Tel: 0724 554 774
  </text>
</svg>
