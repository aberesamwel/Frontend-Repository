<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Truck Body -->
  <rect x="20" y="40" width="80" height="45" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- Truck Cabin -->
  <path d="M 100 40 L 140 40 L 140 70 L 130 85 L 100 85 Z" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- Cabin Window -->
  <rect x="105" y="45" width="25" height="20" fill="#60A5FA" stroke="#1E40AF" stroke-width="1"/>
  
  <!-- Front Grill -->
  <rect x="140" y="55" width="8" height="25" fill="#1E40AF"/>
  <line x1="142" y1="58" x2="142" y2="77" stroke="#3B82F6" stroke-width="1"/>
  <line x1="145" y1="58" x2="145" y2="77" stroke="#3B82F6" stroke-width="1"/>
  
  <!-- Wheels -->
  <circle cx="45" cy="85" r="12" fill="#1F2937" stroke="#111827" stroke-width="2"/>
  <circle cx="45" cy="85" r="6" fill="#6B7280"/>
  
  <circle cx="80" cy="85" r="12" fill="#1F2937" stroke="#111827" stroke-width="2"/>
  <circle cx="80" cy="85" r="6" fill="#6B7280"/>
  
  <circle cx="120" cy="85" r="12" fill="#1F2937" stroke="#111827" stroke-width="2"/>
  <circle cx="120" cy="85" r="6" fill="#6B7280"/>
  
  <!-- Body Details -->
  <line x1="30" y1="50" x2="90" y2="50" stroke="#1E40AF" stroke-width="1"/>
  <line x1="30" y1="60" x2="90" y2="60" stroke="#1E40AF" stroke-width="1"/>
  <line x1="30" y1="70" x2="90" y2="70" stroke="#1E40AF" stroke-width="1"/>
  
  <!-- Headlight -->
  <circle cx="145" cy="65" r="3" fill="#FCD34D"/>
</svg>
